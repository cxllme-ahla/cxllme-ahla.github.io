---
layout: default
---
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} - {{ site.title }}</title>
  
  </head>
<body>

  <div class="container">
    <header style="text-align: left; margin-bottom: 20px;">
      <a href="{{ '/' | relative_url }}" class="btn" style="display: inline-block; margin-bottom: 20px; box-shadow: none;">&laquo; Kembali ke Beranda</a>
    </header>

    <article class="post-card">
      <h1 style="color: var(--accent); margin-top: 0; font-size: 2.2rem;">{{ page.title }}</h1>
      <div class="post-meta" style="margin-bottom: 30px; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 10px;">
        Dipublikasikan pada {{ page.date | date: "%d %B %Y" }}
      </div>
      
      <div class="post-content">
        {{ content }}
      </div>
      
    </article>
  </div>

</body>
</html>
