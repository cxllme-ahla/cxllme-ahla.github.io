<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
</head>
<body>
  <div id="app-container">
    
    <header class="app-header">
      <div class="header-title">{{ site.title }}</div>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle Dark Mode">
        <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
      </button>
    </header>

    <main class="app-content">
      {{ content }}
    </main>

    <footer class="app-footer">
      <p>© {{ 'now' | date: "%Y" }} {{ site.title }}</p>
      <div class="social-links">
        <a href="https://instagram.com/awvr.verse">Instagram</a> | <a href="https://wa.me/6285875556123">WhatsApp</a>
      </div>
    </footer>

    <nav class="bottom-nav">
      <a href="{{ '/' | relative_url }}" class="nav-item">
        <span class="material-symbols-outlined">feed</span>
        <span>Laporan</span>
      </a>
      <a href="{{ '/struktur.html' | relative_url }}" class="nav-item">
        <span class="material-symbols-outlined">group</span>
        <span>Struktur</span>
      </a>
      <a href="{{ '/agenda.html' | relative_url }}" class="nav-item">
        <span class="material-symbols-outlined">event</span>
        <span>Agenda</span>
      </a>
      <a href="{{ '/undangan.html' | relative_url }}" class="nav-item">
        <span class="material-symbols-outlined">mail</span>
        <span>Undangan</span>
      </a>
    </nav>

    <button id="fab-top" class="fab">
      <span class="material-symbols-outlined">arrow_upward</span>
    </button>
  </div>

  <script src="{{ '/assets/js/app.js' | relative_url }}"></script>
</body>
</html>
