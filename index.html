            }
        ];

        // Blog configuration
        const POSTS_PER_PAGE = 3;
        let currentPage = 1;
        let allPosts = [];

        // Theme management
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            themeIcon.textContent = theme === 'dark' ? 'light_mode' : 'dark_mode';
        }

        themeToggle.addEventListener('click', toggleTheme);

        // Load posts
        async function loadPosts() {
            const postsContainer = document.getElementById('postsContainer');
            
            try {
                // Try to load from _posts/ folder (for real GitHub Pages setup)
                const postFiles = [
                    '2026-06-20-memulai-perjalanan.md',
                    '2026-06-15-material-design.md',
                    '2026-06-10-dark-mode.md',
                    '2026-06-05-markdown.md',
                    '2026-06-01-optimasi-performa.md',
                    '2026-05-28-css-grid-vs-flexbox.md',
                    '2026-05-25-javascript-es2024.md',
                    '2026-05-20-belajar-git.md',
                    '2026-05-15-responsive-design.md'
                ];

                const posts = [];
                let loadedFromFile = false;

                for (const file of postFiles) {
                    try {
                        const response = await fetch(`_posts/${file}`);
                        if (response.ok) {
                            const content = await response.text();
                            const post = parseMarkdownFile(file, content);
                            posts.push(post);
                            loadedFromFile = true;
                        }
                    } catch (e) {
                        // File not found, continue
                    }
                }

                if (loadedFromFile && posts.length > 0) {
                    allPosts = posts.sort((a, b) => new Date(b.date) - new Date(a.date));
                } else {
                    // Fallback to sample posts
                    allPosts = samplePosts.sort((a, b) => new Date(b.date) - new Date(a.date));
                }

                renderPosts();
            } catch (error) {
                console.error('Error loading posts:', error);
                allPosts = samplePosts.sort((a, b) => new Date(b.date) - new Date(a.date));
                renderPosts();
            }
        }

        function parseMarkdownFile(filename, content) {
            // Extract date and title from filename
            const match = filename.match(/^(\\d{4}-\\d{2}-\\d{2})-(.+)\\.md$/);
            const date = match ? match[1] : new Date().toISOString().split('T')[0];
            const title = match ? match[2].replace(/-/g, ' ').replace(/\\b\\w/g, l => l.toUpperCase()) : 'Untitled';
            
            return {
                title: title,
                date: date,
                tags: ['Blog'],
                content: content
            };
        }

        function renderPosts() {
            const postsContainer = document.getElementById('postsContainer');
            const paginationContainer = document.getElementById('pagination');

            if (allPosts.length === 0) {
                postsContainer.innerHTML = `
                    <div class="empty-state">
                        <span class="material-icons">inbox</span>
                        <h3>Belum ada postingan</h3>
                        <p>Mulai menulis blog post pertama Anda!</p>
                    </div>
                `;
                paginationContainer.innerHTML = '';
                return;
            }

            const totalPages = Math.ceil(allPosts.length / POSTS_PER_PAGE);
            const startIndex = (currentPage - 1) * POSTS_PER_PAGE;
            const endIndex = startIndex + POSTS_PER_PAGE;
            const postsToShow = allPosts.slice(startIndex, endIndex);

            postsContainer.innerHTML = postsToShow.map(post => `
                <article class="post-card">
                    <div class="post-meta">
                        <span class="post-date">
                            <span class="material-icons">calendar_today</span>
                            ${formatDate(post.date)}
                        </span>
                        <div class="post-tags">
                            ${post.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    </div>
                    <h2 class="post-title">${post.title}</h2>
                    <div class="post-content">${marked.parse(post.content)}</div>
                </article>
            `).join('');

            // Apply syntax highlighting
            document.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });

            // Render pagination
            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const paginationContainer = document.getElementById('pagination');

            if (totalPages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }

            paginationContainer.innerHTML = `
                <button class="pagination-btn" id="prevBtn" ${currentPage === 1 ? 'disabled' : ''}>
                    <span class="material-icons">chevron_left</span>
                    Sebelumnya
                </button>
                <span class="pagination-info">Halaman ${currentPage} dari ${totalPages}</span>
                <button class="pagination-btn" id="nextBtn" ${currentPage === totalPages ? 'disabled' : ''}>
                    Selanjutnya
                    <span class="material-icons">chevron_right</span>
                </button>
            `;

            document.getElementById('prevBtn').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderPosts();
                    scrollToTop();
                }
            });

            document.getElementById('nextBtn').addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderPosts();
                    scrollToTop();
                }
            });
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('id-ID', options);
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Scroll to top button
        const scrollTopBtn = document.getElementById('scrollTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                scrollTopBtn.classList.add('visible');
            } else {
                scrollTopBtn.classList.remove('visible');
            }
        });

        scrollTopBtn.addEventListener('click', scrollToTop);

        // Initialize
        initTheme();
        loadPosts();
    </script>
